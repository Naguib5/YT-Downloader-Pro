<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8"/>
  <title>YT Downloader Pro</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:290px;background:#0a0a0f;color:#f0f0f8;
         font-family:'Segoe UI',Arial,sans-serif;font-size:13px}
    .hdr{background:#111118;padding:12px 16px;border-bottom:2px solid #00d4ff;
         display:flex;align-items:center;gap:10px}
    .hdr-t{font-size:14px;font-weight:700;color:#00d4ff;flex:1}
    .body{padding:14px;display:flex;flex-direction:column;gap:10px}
    #srv-status{display:flex;align-items:center;gap:8px;
      background:#111118;border:1px solid #2a2a3a;border-radius:8px;padding:10px 12px;font-size:12px}
    #srv-dot{width:10px;height:10px;border-radius:50%;background:#444;flex-shrink:0;transition:background .3s}
    #srv-dot.on {background:#00e676;box-shadow:0 0 6px #00e676}
    #srv-dot.off{background:#ff4444;box-shadow:0 0 6px #ff4444}
    #srv-txt{color:#9090a8}
    .tip{background:#111118;border:1px solid #2a2a3a;border-radius:8px;
         padding:12px;font-size:12px;color:#7070a0;line-height:1.9}
    .step{display:flex;align-items:flex-start;gap:7px;margin-bottom:4px}
    .num{background:#00d4ff;color:#000;border-radius:50%;
         width:18px;height:18px;font-size:10px;font-weight:700;
         display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .tip strong{color:#00d4ff}
    .ftr{background:#0d0d12;padding:7px 16px;font-size:10px;
         color:#3a3a4a;text-align:center;border-top:1px solid #1a1a24}
  </style>
</head>
<body>
  <div class="hdr"><span>▶</span><span class="hdr-t">YT Downloader Pro</span></div>
  <div class="body">
    <div id="srv-status">
      <div id="srv-dot"></div>
      <span id="srv-txt">جاري فحص الهوست...</span>
    </div>
    <div class="tip">
      <div class="step"><div class="num">1</div><span>شغّل <strong>install.bat</strong> مرة واحدة فقط</span></div>
      <div class="step"><div class="num">2</div><span>افتح أي فيديو يوتيوب</span></div>
      <div class="step"><div class="num">3</div><span>اضغط <strong>⬇ تحميل</strong> واختار الجودة</span></div>
      <div class="step"><div class="num">4</div><span>يحمّل مباشرة بدون أي برنامج! 🎉</span></div>
    </div>
  </div>
  <div class="ftr">Native Messaging • yt-dlp • v5.0</div>
  <script src="popup.js"></script>
</body>
</html>
